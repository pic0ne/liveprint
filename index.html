<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>liveprint</title>
    <meta name="theme-color" content="#f1f1f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="doc">
        <span class="wordmark">liveprint</span>
        <span class="file-name" id="file-name"></span>
        <span class="edited" id="file-edited" hidden>Edited</span>
        <span class="image-notice" id="image-notice" hidden>
          <span id="image-notice-text"></span>
          <button type="button" class="quiet" id="choose-folder">Choose folder</button>
        </span>
      </div>
      <div class="actions">
        <div class="settings" id="settings">
          <button type="button" aria-expanded="false" aria-controls="settings-panel">A4 · Normal · Book</button>
          <div class="settings-panel" id="settings-panel" role="group" aria-label="Page settings" hidden></div>
        </div>
        <button type="button" id="open" aria-keyshortcuts="Control+O Meta+O" title="Open (Ctrl+O)">Open</button>
        <button type="button" id="save" aria-keyshortcuts="Control+S Meta+S" title="Save (Ctrl+S). Shift-click or press Shift+Ctrl+S to save as">Save</button>
        <button type="button" id="download-pdf" aria-label="Download .pdf"><span class="long">Download </span>.pdf</button>
      </div>
    </header>
    <main class="split" id="split">
      <section class="editor" id="editor" aria-label="Markdown"></section>
      <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"></div>
      <section class="preview" aria-label="Preview">
        <div class="pages" id="pages"></div>
        <div class="overlay" id="overlay" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
